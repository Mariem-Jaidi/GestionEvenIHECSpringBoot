<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>IHEC Carthage - Connexion</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #003366 0%, #0066cc 100%);
            display: flex; align-items: center; justify-content: center;
        }
        .card {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 48px 40px;
            width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .logo { text-align: center; font-size: 56px; margin-bottom: 8px; }
        h1 { text-align: center; color: white; font-size: 24px; margin-bottom: 4px; }
        .subtitle { text-align: center; color: rgba(255,255,255,0.7); font-size: 14px; margin-bottom: 32px; }
        label { display: block; color: rgba(255,255,255,0.9); font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        input {
            width: 100%; padding: 13px 16px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.15); color: white;
            font-size: 15px; margin-bottom: 20px; outline: none;
        }
        input::placeholder { color: rgba(255,255,255,0.5); }
        input:focus { border-color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.2); }
        .btn {
            width: 100%; padding: 14px; border-radius: 12px; border: none;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white; font-size: 16px; font-weight: 700;
            cursor: pointer; transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .alert-error {
            background: rgba(231,76,60,0.3); border: 1px solid rgba(231,76,60,0.6);
            color: white; padding: 12px; border-radius: 10px; margin-bottom: 20px;
            text-align: center; font-size: 14px;
        }
        .alert-success {
            background: rgba(46,204,113,0.3); border: 1px solid rgba(46,204,113,0.6);
            color: white; padding: 12px; border-radius: 10px; margin-bottom: 20px;
            text-align: center; font-size: 14px;
        }
        .hint {
            margin-top: 24px; text-align: center;
            color: rgba(255,255,255,0.5); font-size: 12px; line-height: 1.8;
        }
        .divider { border: none; border-top: 1px solid rgba(255,255,255,0.15); margin: 24px 0; }
        .visiteur-btn {
            width: 100%; padding: 12px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.4);
            background: rgba(52,152,219,0.3); color: white;
            font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s;
        }
        .visiteur-btn:hover { background: rgba(52,152,219,0.5); }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">🎓</div>
    <h1>IHEC Carthage</h1>
    <p class="subtitle">Système de Gestion des Événements</p>

    <div th:if="${error}" class="alert-error">✗ <span th:text="${error}"></span></div>
    <div th:if="${logout}" class="alert-success">✓ <span th:text="${logout}"></span></div>

    <form th:action="@{/login}" method="post">
        <label>👤 Nom d'utilisateur</label>
        <input type="text" name="username" placeholder="Ex: adminUni" required />
        <label>🔒 Mot de passe</label>
        <input type="password" name="password" placeholder="••••••••" required />
        <button type="submit" class="btn">Se connecter →</button>
    </form>

    <hr class="divider"/>

    <form th:action="@{/login}" method="post">
        <input type="hidden" name="username" value="visiteur"/>
        <input type="hidden" name="password" value="visiteur123"/>
        <button type="submit" class="visiteur-btn">👥 Continuer en tant que Visiteur</button>
    </form>

    <div class="hint">
        Admin: adminUni / ihec2025<br>
        Clubs: hecfa, artrev, lions, enactus, aiesec, mmt, libertad, ihecnews<br>
        (mot de passe = nomclub + 2025)
    </div>
</div>
</body>
</html>
