<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestion des Événements - Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { text-align: center; padding: 50px; }
        h1 { font-size: 36px; color: #1f2937; margin-bottom: 10px; }
        .subtitle { font-size: 18px; color: #6b7280; margin-bottom: 60px; }
        .btn { display: block; width: 400px; padding: 22px; margin: 0 auto 20px; font-size: 18px; font-weight: bold; color: white; border: none; border-radius: 8px; cursor: pointer; text-decoration: none; text-align: center; }
        .btn-primary { background: #2563eb; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { background: #10b981; }
        .btn-secondary:hover { background: #059669; }
        .footer { margin-top: 60px; color: #9ca3af; font-style: italic; }
    </style>
</head>
<body>
<div class="container">
    <h1>Gestion des Événements</h1>
    <p class="subtitle">Tableau de bord</p>
    <a th:href="@{/ajouter}" class="btn btn-primary">➕ Ajouter un événement</a>
    <a th:href="@{/rechercher}" class="btn btn-secondary">🔍 Rechercher un événement</a>
    <p class="footer">Sélectionnez une action pour continuer</p>
</div>
</body>
</html>
